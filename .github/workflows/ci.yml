name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Engine — testes
        run: npm test --workspace packages/engine
      - name: Web — testes
        run: npm test --workspace apps/web
      - name: Web — build
        run: npm run build --workspace apps/web
